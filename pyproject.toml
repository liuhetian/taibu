[project]
name = "suanming-kernel"
version = "0.1.0"
description = "A self-contained, extensible divination kernel with a JSON-only CLI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.12,<3",
  "tzdata>=2025.2",
]

[project.scripts]
suanming = "suanming.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/suanming"]

[tool.hatch.build.targets.wheel.force-include]
"assets" = "suanming/_bundle/assets"

[tool.hatch.build.targets.sdist]
include = [
  "/assets",
  "/src",
  "/tests",
  "/README.md",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.uv]
package = true
